<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e5f"/>
      <stop offset="50%" stop-color="#feb47b"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#feb47b" stop-opacity="0.0"/>
    </linearGradient>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#text-grad); }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
      
      /* Dynamic Animated Elements in Background */
      @keyframes float1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        50% { transform: translate(30px, -20px) scale(1.08); opacity: 0.6; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      }
      @keyframes float2 {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 0.25; }
        50% { transform: translate(-25px, 25px) rotate(180deg); opacity: 0.55; }
        100% { transform: translate(0, 0) rotate(360deg); opacity: 0.25; }
      }
      @keyframes pulseLine {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      
      .bg-node-1 { animation: float1 8s ease-in-out infinite; }
      .bg-node-2 { animation: float2 12s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 20 10; animation: pulseLine 15s linear infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- Dynamic / Animated Background Graphics (Behind text and foreground) -->
  <g opacity="0.4">
    <!-- Connecting Flow Network Lines -->
    <path class="flow-line" d="M 100 220 Q 300 80 600 220 T 1100 100" fill="none" stroke="#ff7e5f" stroke-width="2" opacity="0.4"/>
    <path class="flow-line" d="M 50 100 Q 400 250 800 120 T 1150 240" fill="none" stroke="#feb47b" stroke-width="1.5" opacity="0.3"/>

    <!-- Dynamic Floating Graphic Nodes -->
    <circle class="bg-node-1" cx="950" cy="110" r="70" fill="url(#pulse-grad)"/>
    <circle class="bg-node-2" cx="1050" cy="210" r="45" fill="none" stroke="#ff7e5f" stroke-width="2"/>
    <rect class="bg-node-1" x="820" y="170" width="60" height="60" rx="12" fill="none" stroke="#feb47b" stroke-width="2" transform="rotate(15 850 200)"/>
    <circle class="bg-node-2" cx="150" cy="80" r="50" fill="url(#pulse-grad)"/>
  </g>

  <!-- Foreground Content Container (Guaranteed clear & legible overlay) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 45)">
      <rect width="280" height="32" rx="16" fill="#ff7e5f" fill-opacity="0.15" stroke="#ff7e5f" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="21" class="badge-text" fill="#ff7e5f">🚀 CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Food Delivery Management</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Multi-Channel Aggregation • POS Sync • First-Party Ordering • Dispatch Logistics</text>

    <!-- Quick Stat Badges Banner Footer -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🍔 SaaS &amp; Open Source</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="191" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">⚡ Real-time Market Data</text>

      <!-- Pill 3 -->
      <rect x="355" y="0" width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="371" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">⭐ GitHub Curated</text>
    </g>
  </g>
</svg>
